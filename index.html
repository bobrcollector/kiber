<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiberOne: задачи по уровням</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f8ff 0%, #f4f7f6 100%);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 40px;
            text-align: center;
            font-size: 16px;
        }

        .levels {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        .level-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            padding: 30px;
            width: 280px;
            text-decoration: none;
            color: #333;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 6px solid #ccc;
        }

        .level-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.18);
        }

        .level-card.junior { border-top-color: #f39c12; }
        .level-card.middle { border-top-color: #2980b9; }
        .level-card.senior { border-top-color: #8e44ad; }

        .level-card .emoji {
            font-size: 56px;
            display: block;
            margin-bottom: 15px;
        }

        .level-card h2 {
            margin: 0 0 8px 0;
            font-size: 20px;
        }

        .level-card.junior h2 { color: #e67e22; }
        .level-card.middle h2 { color: #2980b9; }
        .level-card.senior h2 { color: #8e44ad; }

        .level-card .age {
            font-size: 14px;
            color: #888;
            margin-bottom: 12px;
        }

        .level-card .count {
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>🚀 KiberOne: интерактивные задачи</h1>
    <p class="subtitle">Выбери уровень сложности, чтобы перейти к задачам</p>

    <div class="levels">
        <a class="level-card junior" href="junior/index.html">
            <span class="emoji">🐰</span>
            <h2>Младшие</h2>
            <div class="age">6-8 лет</div>
            <div class="count">1 задача</div>
        </a>

        <a class="level-card middle" href="middle/index.html">
            <span class="emoji">🧮</span>
            <h2>Средние</h2>
            <div class="age">9-11 лет</div>
            <div class="count">18 задач</div>
        </a>

        <a class="level-card senior" href="senior/index.html">
            <span class="emoji">🛡️</span>
            <h2>Старшие</h2>
            <div class="age">12-14 лет</div>
            <div class="count">21 задача</div>
        </a>
    </div>

</body>
</html>
